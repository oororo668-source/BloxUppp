<html lang="ru">
<head>

<title>BloxUp</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root { --bg-0: #0a1020; --bg-1: #101830; --bg-2: #16223e; --bg-3: #1e2c4e; --border: #2a3a5e; --border-light: #3a4e78; --text: #ffffff; --text-dim: #c8d4e8; --muted: #7a8aaa; --blue: #3b82f6; --blue-bright: #60a5fa; --green: #22c55e; --red: #ef4444; --gold: #fbbf24; --accent: linear-gradient(135deg, #3b82f6, #8b5cf6); --accent-glow: rgba(59,130,246,0.4); --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px); --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1); --ease-smooth: cubic-bezier(0.4, 0, 0.2, 1); }
body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg-0); color: var(--text); padding: calc(12px + var(--safe-top)) 12px calc(12px + var(--safe-bottom)); max-width: 520px; margin: 0 auto; min-height: 100vh; overflow-x: hidden; user-select: none; }
button, input { transition: all 0.25s var(--ease-smooth); }
#toastContainer { position: fixed; top: calc(12px + var(--safe-top)); left: 50%; transform: translateX(-50%); z-index: 20000; display: flex; flex-direction: column; gap: 8px; pointer-events: none; width: 380px; max-width: calc(100vw - 24px); }
.toast { background: var(--bg-2); border: 1px solid var(--border-light); padding: 12px 16px; border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); display: flex; align-items: center; gap: 10px; font-size: 13px; animation: toastIn 0.4s var(--ease-spring); pointer-events: auto; }
.toast.success { border-color: var(--green); color: var(--green); }
.toast.error { border-color: var(--red); color: var(--red); }
.toast.info { border-color: var(--blue-bright); color: var(--blue-bright); }
@keyframes toastIn { 0% { opacity: 0; transform: translateY(-24px) scale(0.9); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
#authScreen { position: fixed; inset: 0; background: radial-gradient(ellipse at 50% 0%, #12244a 0%, var(--bg-0) 60%); display: flex; align-items: center; justify-content: center; z-index: 10000; padding: 20px; }
.auth-box { background: var(--bg-2); padding: 34px 24px; border-radius: 20px; border: 1px solid var(--border-light); box-shadow: 0 20px 60px rgba(0,0,0,0.7); width: 100%; max-width: 380px; }
.auth-logo { text-align: center; font-size: 32px; font-weight: 900; margin-bottom: 6px; background: linear-gradient(135deg, #ffffff, #60a5fa, #8b5cf6); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 3px; }
.auth-subtitle { text-align: center; font-size: 12px; color: var(--muted); margin-bottom: 24px; letter-spacing: 2px; }

.auth-btn:disabled { opacity: 0.5; }

.wheel-center-circle .mult { font-size: 22px; font-weight: 900; color: var(--blue-bright); }

.quick-btn { background: var(--bg-2); border: 2px solid var(--border); border-radius: 12px; padding: 10px 2px; cursor: pointer; font-weight: 800; font-size: 12px; color: var(--text); text-align: center; }

.slider-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0%; background: var(--accent); border-radius: 4px; }
.slider-thumb { position: absolute; top: 50%; left: 13px; transform: translate(-50%, -50%); width: 26px; height: 26px; background: #fff; border-radius: 50%; box-shadow: 0 3px 10px rgba(0,0,0,0.5), 0 0 0 3px var(--blue-bright); pointer-events: none; }
#percentSlider { position: relative; width: 100%; height: 40px; -webkit-appearance: none; background: transparent; outline: none; cursor: pointer; z-index: 2; margin: 0; }
#percentSlider::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; background: transparent; border: none; }
.percent-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }

.leader-row.top1 .leader-amount { color: var(--gold); }
